<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local layout fixture</title>
  <link rel="icon" href="data:,">
  <style>
    /* Minimal host context, not a replacement stylesheet for the extension. */
    :root {
      --mainFontFamily: "Microsoft YaHei", sans-serif;
      --SmartThemeBlurTintColor: #283342;
      --SmartThemeBodyColor: #dde6f0;
      --SmartThemeQuoteColor: #9fc7e3;
      --SmartThemeBorderColor: #526377;
      --SmartThemeEmColor: #dbbd81;
      --fullred: #e1a4a4;
    }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { background: #162433; color: var(--SmartThemeBodyColor); font: 15px/1.55 var(--mainFontFamily); }
    *, *::before, *::after { box-sizing: border-box; }
    body > aside { padding: 16px; }
    #completion_prompt_manager_list { max-height: 420px; overflow-y: auto; }
    .completion_prompt_manager_header { display: flex; gap: 8px; align-items: center; }
    [data-pm-identifier] { padding: 8px; border-bottom: 1px solid var(--SmartThemeBorderColor); }
    .inline-drawer-content { display: grid; gap: 8px; }
    .checkbox_label { display: flex; gap: 8px; align-items: center; }
    /* Exercise the native theme's important field rules as well. */
    input, textarea, select { background: var(--SmartThemeBlurTintColor) !important; color: var(--SmartThemeBodyColor) !important; }
  </style>
  <link rel="stylesheet" href="/scripts/extensions/third-party/ui-layout-fixture/style.css">
</head>
<body>
  <div id="ai-config-button"><button class="drawer-toggle" type="button">模拟预设配置</button></div>
  <aside id="left-nav-panel" class="openDrawer">
    <section id="completion_prompt_manager">
      <header class="completion_prompt_manager_header">
        <label for="settings_preset_openai">固定预设</label>
        <select id="settings_preset_openai"><option value="0">UI Layout Fixture</option></select>
      </header>
      <div id="completion_prompt_manager_list"></div>
      <footer class="completion_prompt_manager_footer"><button class="fa-plus-square" type="button" aria-label="原生新增">新增</button></footer>
      <input id="fixture-host-input" value="模拟酒馆输入框" aria-label="模拟酒馆输入框">
    </section>
  </aside>
  <aside id="extensions_settings2" hidden></aside>
  <script type="module">
    import { createFixture } from '/fixtures/ui-layout-context.js';
    try {
      const seedResponse = await fetch('/fixtures/ui-layout-seed.json');
      if (!seedResponse.ok) throw new Error('Fixture seed unavailable');
      globalThis.__pmmeFixture = createFixture(await seedResponse.json());
      document.querySelector('#ai-config-button > .drawer-toggle').addEventListener('click', () => globalThis.__pmmeFixture.openDrawer());
      await import('/scripts/extensions/third-party/ui-layout-fixture/index.js');
      await globalThis.__pmmeFixture.context.eventSource.emit(globalThis.__pmmeFixture.context.eventTypes.APP_READY);
      document.documentElement.dataset.fixtureReady = 'true';
    } catch (error) {
      globalThis.__pmmeFixtureBootError = String(error.stack || error);
      console.error(error);
    }
  </script>
</body>
</html>
