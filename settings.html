<div id="pmme-settings" class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>回声编辑台</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <label class="checkbox_label"><input id="pmme-setting-enabled" type="checkbox"><span>启用回声编辑台</span></label>
        <label class="checkbox_label"><input id="pmme-setting-intercept" type="checkbox"><span>使用回声编辑台打开预设的“新增”和“编辑”</span></label>
        <label class="checkbox_label"><input id="pmme-setting-enable-new" type="checkbox"><span>新草稿默认勾选“首次保存后启用”</span></label>
        <label class="pmme-setting-theme" for="pmme-setting-theme"><span>界面主题</span><select id="pmme-setting-theme" class="text_pole"><option value="paper">纸白</option><option value="night">夜色</option><option value="tavern">跟随酒馆</option></select></label>
        <div class="pmme-setting-help">从预设区域的“回声编辑台”进入。短条目原地改，长正文全屏写；通过拖动整理顺序。返回时回到酒馆预设编辑区。</div>
        <div class="pmme-setting-help">保存条目后仍需更新命名预设。草稿在本次页面保留，刷新前请保存。主题选择只影响回声编辑台。</div>
        <button id="pmme-setting-open" type="button" class="menu_button">打开回声编辑台</button>
    </div>
</div>
